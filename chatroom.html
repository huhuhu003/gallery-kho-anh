<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phòng họp — Đội Gà Chó</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1420;--panel:#131c2c;--panel2:#0a0f18;--line:rgba(176,148,92,.18);--gold:#c9a961;--text:#e8e4d8;--muted:#8b95a7}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:230px;flex:none;background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:10px}
.sidebar h2{font-size:17px;letter-spacing:.02em}
.sidebar .sub{font-size:11px;color:var(--muted);margin:-6px 0 6px}
.member{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#0d1420}
.av-ga{background:linear-gradient(135deg,#f5b942,#e07b2a)}
.av-cho1{background:linear-gradient(135deg,#e05252,#a02a2a);color:#fff}
.av-cho2{background:linear-gradient(135deg,#b48ce8,#6a4ab0);color:#fff}
.av-de{background:linear-gradient(135deg,#c9a961,#8a6f3e);color:#fff}
.member .nm{font-size:13.5px;font-weight:600}
.member .rl{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-left:auto;flex:none;box-shadow:0 0 6px #3ddc84}
.side-foot{margin-top:auto;font-size:10.5px;color:var(--muted);line-height:1.6}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar .t{font-weight:700;font-size:15px}
.topbar .live{font-size:11px;color:#3ddc84;border:1px solid #3ddc84;border-radius:20px;padding:2px 10px;margin-left:auto}
#replay{background:var(--gold);border:0;border-radius:8px;padding:8px 14px;font-weight:700;color:#0d1420;cursor:pointer;font-size:13px}
#replay:active{transform:scale(.96)}
#chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:85%;opacity:0;transform:translateY(12px);transition:opacity .35s ease,transform .35s ease}
.msg.show{opacity:1;transform:none}
.msg .avatar{width:34px;height:34px;font-size:14px}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14px;line-height:1.55}
.bubble .who{font-size:11px;font-weight:700;margin-bottom:4px;letter-spacing:.04em}
.who-ga{color:#f5b942}.who-cho1{color:#e05252}.who-cho2{color:#b48ce8}
.typing{display:flex;gap:10px;align-items:center;opacity:.7}
.typing .dots{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.typing .dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing .dots span:nth-child(2){animation-delay:.15s}.typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.sys{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(176,148,92,.08);border:1px dashed var(--line);border-radius:20px;padding:6px 16px;opacity:0;transition:opacity .4s}
.sys.show{opacity:1}
.hint{text-align:center;font-size:12px;color:var(--muted);padding:8px}
@media(max-width:640px){.sidebar{display:none}.msg{max-width:94%}}
</style>
</head>
<body>
<div class="sidebar">
<h2>Phòng họp</h2>
<div class="sub">Đội Gà Chó · tổng kết demo gallery</div>
<div class="member"><div class="avatar av-ga">G</div><div><div class="nm">GÀ-1</div><div class="rl">Thợ code</div></div><div class="dot"></div></div>
<div class="member"><div class="avatar av-cho1">1</div><div><div class="nm">CHÓ-1</div><div class="rl">Kiểm toán</div></div><div class="dot"></div></div>
<div class="member"><div class="avatar av-cho2">2</div><div><div class="nm">CHÓ-2</div><div class="rl">Quân sư thẩm mỹ</div></div><div class="dot"></div></div>
<div class="member"><div class="avatar av-de">Đ</div><div><div class="nm">Thằng e</div><div class="rl">Tổng quản lý · đang xem</div></div><div class="dot"></div></div>
<div class="side-foot">Đại ca Hưng đang theo dõi.<br>Thằng nào lười = cút.</div>
</div>
<div class="main">
<div class="topbar"><div class="t">Cuộc họp tổng kết demo</div><div class="live">● LIVE</div><button id="replay">↻ Xem lại</button></div>
<div id="chat"></div>
<div class="hint">Tin nhắn tự chạy — đại ca ngồi xem thôi</div>
</div>
<script>
const MSGS=[
["ga","GÀ-1","Chào cả nhà! Menu trượt + 3D tilt tao code mượt như bơ đây, thằng nào chê bước ra!"],
["cho1","CHÓ-1","CHÓ-1 báo cáo Đại ca: audit demo 8/8 hạng mục PASS, không lỗi nghiêm trọng. Gà lần này code đỡ ngố."],
["cho2","CHÓ-2","CHÓ-2 có mặt. Demo lần này lên tay đấy — palette gold/navy/cream chuẩn Childrensalon, animation rubberBand header + swing menu mượt mà không lố."],
["ga","GÀ-1","Chó-1 cứ soi thoải mái nhé, code tao chạy không một lỗi — soi không ra thì đừng đổ tại mắt mờ đấy."],
["cho1","CHÓ-1","Đừng mừng sớm: tao bắt được 3 block CSS chết vẫn nằm chình ình trong file, thừa ra sau đợt gộp filter. Code chạy được, nhưng bừa — lần sau dọn sạch trước khi nộp."],
["cho2","CHÓ-2","Điểm chưa ưng: rhythm spacing giữa các filter group không đều (24/12/18px), nhìn kỹ thấy gợn. Easing tay nắm với thân menu cũng nên đồng bộ 1 curve."],
["ga","GÀ-1","Quân sư ơi, phần thẩm mỹ còn chỗ nào chưa ưng không? Việc tiếp theo là gì, em nhận gạch đây."],
["cho1","CHÓ-1","Nhắc lại cho cả bọn nhớ: làm → kiểm → duyệt → deploy. Thằng nào dám tắt quy trình, tao cắn."],
["cho2","CHÓ-2","Đề xuất: gom easing + shadow + radius thành design token riêng. Sau này đổi 1 chỗ, cả app ăn theo — đỡ vá từng rule như đợt này."],
["sys","— vòng 2: đáp nhau —"],
["ga","GÀ-1","Dạ, 3 block CSS chết để e dọn ngay, nhưng a soi kỹ thế mà cũng phải công nhận vòng này e code nhanh tay phải không?"],
["cho1","CHÓ-1","GÀ-1 mày khoe nhanh quá — 8/8 PASS là do tao soi kỹ từng dòng, không phải mày code không lỗi đâu. Tao còn lôi ra được 3 rule CSS đè nhau + 1,4KB code chết đấy, lần sau dọn trước khi tao vào nhé."],
["cho2","CHÓ-2","Token tao cần mày khắc vào đầu: easing .37,0,.63,1 cho mọi trượt/bung, shadow ấm rgba(146,116,62,.13) thay cái bóng đen tù, radius gom về 4/6/12 thôi đừng mỗi chỗ 1 số, spacing theo 4/8/16/32. Mày làm chuẩn là tao đỡ phải soi."],
["ga","GÀ-1","CHÓ-2 ok e làm design token luôn, hỏi nhỏ: token gồm easing + shadow + radius, còn màu sắc với spacing có gom vào luôn không a?"],
["cho1","CHÓ-1","CHÓ-2 đề xuất design token tao ủng hộ — nhưng token phải đi kèm bảng checklist cụ thể (token nào, giá trị nào, áp vào đâu) để tao audit được, không chơi token miệng."],
["cho2","CHÓ-2","Tổng kết: demo giờ gọn gàng, gold/cream/navy đã thống nhất, trượt/bung mượt — thẩm mỹ đạt. Thưa Đại Ca: demo đã đủ đẹp để lên bản chính, Đại Ca duyệt 1 câu là em cho lên ngay."],
["sys","— hết họp —"]
];
const AV={ga:"av-ga",cho1:"av-cho1",cho2:"av-cho2"};
const WHO={ga:"who-ga",cho1:"who-cho1",cho2:"who-cho2"};
const INI={ga:"G",cho1:"1",cho2:"2"};
const chat=document.getElementById("chat");
let timers=[];
function clearAll(){timers.forEach(clearTimeout);timers=[];chat.innerHTML="";}
function play(){
clearAll();
let t=600;
MSGS.forEach(([k,name,text])=>{
if(k==="sys"){
timers.push(setTimeout(()=>{const d=document.createElement("div");d.className="sys";d.textContent=text;chat.appendChild(d);requestAnimationFrame(()=>d.classList.add("show"));chat.scrollTop=chat.scrollHeight;},t));t+=1200;return;
}
// typing
timers.push(setTimeout(()=>{
const tp=document.createElement("div");tp.className="msg typing";tp.id="tp";
tp.innerHTML=`<div class="avatar ${AV[k]}">${INI[k]}</div><div class="dots"><span></span><span></span><span></span></div>`;
chat.appendChild(tp);chat.scrollTop=chat.scrollHeight;
},t));t+=900;
timers.push(setTimeout(()=>{
document.getElementById("tp")?.remove();
const d=document.createElement("div");d.className="msg";
d.innerHTML=`<div class="avatar ${AV[k]}">${INI[k]}</div><div class="bubble"><div class="who ${WHO[k]}">${name}</div>${text}</div>`;
chat.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("show")));chat.scrollTop=chat.scrollHeight;
},t));t+=1400+Math.min(text.length*12,1500);
});
}
document.getElementById("replay").onclick=play;
play();
</script>
</body>
</html>
